<html>
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <body>

        <div id="todos">
        </div>
        
    </body>
    <script> 

        // rendering todos on frontend using DOM

        // using axios cdn
        axios.get("https://jsonplaceholder.typicode.com/todos/")
        .then(response => {
            console.log(response.data);
             response.data.map((todo) => {
                const child = document.createElement("div");
                child.innerHTML = todo.title;
                child.setAttribute("style", "background-color: grey; padding: 5px; margin: 10px; border: 2px solid black; border-radius: 5px; font-weight:600");
                document.getElementById("todos").appendChild(child);
            });
        })
        .catch(err => console.log("Error occured ", err));
